<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GPGP 3D 海洋環保大冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1e293b; font-family: 'Noto Sans TC', sans-serif; touch-action: none; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .hidden-custom { display: none !important; }
        .fade-in { animation: fadeIn 1s forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .action-btn { transition: all 0.1s; }
        .action-btn:active { transform: scale(0.95); }

        /* Video Overlay Styles */
        #video-overlay {
            transition: opacity 1.5s ease-in-out;
            background-color: black;
        }
    </style>
</head>
<body>

    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- Video Overlay (Initially Hidden) -->
    <div id="video-overlay" class="absolute inset-0 z-50 hidden-custom flex flex-col items-center justify-center opacity-0">
        <video id="victory-video" class="w-full h-full object-contain" playsinline>
            <!-- 建議將影片檔名改為英文，例如 victory.mp4，以避免 GitHub Pages 無法讀取中文檔名的問題 -->
            <source src="./victory.mp4" type="video/mp4">
            您的瀏覽器不支援影片播放，請確認影片檔案是否在同一資料夾中。
        </video>
        <!-- Replay Button (appears over video) -->
        <button onclick="location.reload()" class="absolute bottom-10 right-10 bg-white/20 hover:bg-white/40 text-white font-bold py-3 px-8 rounded-full backdrop-blur-md transition border border-white/30 hover:scale-105">
            🔄 再玩一次
        </button>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer" class="absolute top-0 left-0 w-full h-full pointer-events-none flex flex-col justify-between p-2 md:p-4 z-10 transition-opacity duration-1000">
        
        <!-- Top Header Area -->
        <div class="flex flex-col md:flex-row justify-between items-start pointer-events-auto gap-2 w-full">
            <!-- Title Box -->
            <div class="glass-panel p-3 md:p-4 max-w-[90%] md:max-w-md shadow-lg">
                <h1 class="text-lg md:text-2xl font-bold text-blue-800 mb-1">🌊 GPGP 海洋環保大冒險</h1>
                <p class="text-xs md:text-sm text-slate-600 hidden md:block">雙人對戰：紅色避開微塑膠，綠色尋找環保行動，黃色學習冷知識！</p>
            </div>

            <!-- Score Box -->
            <div class="glass-panel p-2 md:p-3 flex flex-row md:flex-col gap-3 md:gap-1 shadow-lg self-end md:self-auto">
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 md:w-4 md:h-4 rounded-full bg-red-500 shadow-sm border border-white"></div>
                    <span id="p1-score" class="font-bold text-xs md:text-sm text-slate-700 whitespace-nowrap">P1: 起點</span>
                </div>
                <div class="flex items-center gap-2">
                    <div class="w-3 h-3 md:w-4 md:h-4 rounded-full bg-blue-500 shadow-sm border border-white"></div>
                    <span id="p2-score" class="font-bold text-xs md:text-sm text-slate-700 whitespace-nowrap">P2: 起點</span>
                </div>
            </div>
        </div>

        <!-- Bottom Controls Area -->
        <div class="pointer-events-auto w-full flex justify-center md:justify-end md:absolute md:bottom-6 md:right-6 pb-4 md:pb-0">
            <div class="glass-panel p-3 md:p-5 flex flex-row md:flex-col items-center gap-3 md:gap-4 shadow-xl transform transition-all">
                
                <!-- Turn Indicator -->
                <div id="turn-indicator" class="text-sm md:text-base font-bold text-red-600 bg-red-100 px-4 py-2 rounded-full whitespace-nowrap border border-red-200">
                    換 玩家 1
                </div>

                <!-- Roll Button -->
                <button id="roll-btn" class="action-btn bg-gradient-to-r from-blue-600 to-blue-400 active:from-blue-700 active:to-blue-600 text-white font-bold rounded-full shadow-lg shadow-blue-500/30 flex items-center gap-2 px-6 py-3 md:px-8 md:py-3 text-lg md:text-xl">
                    🎲 <span class="hidden md:inline">擲骰子</span><span class="md:hidden">GO!</span>
                </button>

                <!-- Dice Result Display -->
                <div id="dice-result" class="text-xl md:text-2xl font-bold text-slate-800 min-w-[3rem] text-center">
                    -
                </div>
            </div>
        </div>
    </div>

    <!-- Fact Modal -->
    <div id="fact-modal" class="absolute inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center pointer-events-auto hidden-custom z-50 px-4">
        <div class="glass-panel p-6 md:p-8 w-full max-w-sm md:max-w-lg text-center transform transition-all shadow-2xl border-2 border-white/50">
            <div id="modal-icon" class="text-5xl md:text-6xl mb-4 animate-bounce">⚠️</div>
            <h2 id="modal-title" class="text-xl md:text-2xl font-bold mb-3 text-slate-800">遇見 GPGP!</h2>
            <p id="modal-desc" class="text-base md:text-lg text-slate-600 mb-6 leading-relaxed">這裡是太平洋垃圾帶...</p>
            <button onclick="closeModal()" class="action-btn bg-slate-800 text-white px-8 py-3 rounded-xl font-bold text-lg hover:bg-slate-700 w-full md:w-auto shadow-lg">
                了解了！
            </button>
        </div>
    </div>

    <!-- Win Notification (Temporary Toast) -->
    <div id="win-toast" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none flex flex-col items-center justify-center hidden-custom z-50 transition-all duration-500">
        <div class="glass-panel p-6 md:p-10 text-center shadow-2xl border-4 border-yellow-300 bg-white/95">
            <div class="text-6xl md:text-7xl mb-4 animate-pulse">🏆</div>
            <h2 id="winner-text" class="text-3xl md:text-4xl font-bold text-blue-600 mb-2">玩家 1 獲勝！</h2>
            <p class="text-lg text-slate-600 font-bold">愛心熱氣球來接你了！準備升空！🎈</p>
        </div>
    </div>

    <script>
        // --- Sound System ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playMoveSound(playerId) {
            if (!audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (playerId === 1) {
                // Player 1 (Red): Higher pitched "Biu" or "Boing"
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(600, now);
                oscillator.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                
                oscillator.start(now);
                oscillator.stop(now + 0.15);
            } else {
                // Player 2 (Blue): Lower, bubbly "Poy"
                oscillator.type = 'triangle'; // Softer shape
                oscillator.frequency.setValueAtTime(400, now);
                oscillator.frequency.linearRampToValueAtTime(500, now + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                
                oscillator.start(now);
                oscillator.stop(now + 0.15);
            }
        }

        function playDiceSound() {
            if (!audioCtx) return;
            // Simple click/tick for dice
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            osc.type = 'square';
            osc.frequency.setValueAtTime(800 + Math.random()*200, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            
            osc.start(now);
            osc.stop(now + 0.05);
        }

        // --- Game Config ---
        const BOARD_SIZE = 10;
        const TILE_SIZE = 2; 
        
        const EVENTS = {
            // Ladders (Green)
            4: { end: 14, type: 'ladder', title: "使用環保袋 🛍️", text: "你拒絕了塑膠袋，減少了垃圾產生！前進到 14 格。" },
            9: { end: 31, type: 'ladder', title: "參與淨灘 🏖️", text: "週末淨灘活動清理了大量海洋廢棄物！大幅前進到 31 格。" },
            21: { end: 42, type: 'ladder', title: "回收分類 ♻️", text: "你正確地分類了塑膠垃圾，防止它們進入海洋。前進到 42 格。" },
            28: { end: 84, type: 'ladder', title: "科學創新 🔬", text: "科學家發明了分解塑膠的新酵素！這是巨大的突破！飛躍到 84 格。" },
            51: { end: 67, type: 'ladder', title: "自帶水壺 🥤", text: "你養成了自帶水壺的好習慣，減少寶特瓶使用。前進到 67 格。" },
            71: { end: 91, type: 'ladder', title: "政策立法 📜", text: "政府通過了禁止一次性塑膠的法案！環境大幅改善。前進到 91 格。" },
            
            // Snakes (Red)
            17: { end: 7, type: 'snake', title: "誤食塑膠 🐢", text: "海龜誤將塑膠袋當成水母吃下。這太令人悲傷了，後退到 7 格。" },
            54: { end: 34, type: 'snake', title: "GPGP 擴大 😱", text: "太平洋垃圾帶 (GPGP) 面積持續擴大，現在已經有三個法國那麼大！後退到 34 格。" },
            62: { end: 19, type: 'snake', title: "微塑膠入侵 🐟", text: "微塑膠進入了食物鏈，最終被人類吃下。嚴重健康隱憂，大幅後退到 19 格。" },
            64: { end: 60, type: 'snake', title: "塑膠纏繞 🕸️", text: "海鳥被廢棄的漁網纏住無法脫身。後退到 60 格。" },
            87: { end: 24, type: 'snake', title: "需要 450 年 ⏳", text: "你丟棄的寶特瓶需要 450 年才能分解。它將長期危害環境。跌落回 24 格。" },
            93: { end: 73, type: 'snake', title: "洋流匯聚 🌊", text: "洋流將世界各地的垃圾帶到了這裡，形成了巨大的垃圾島。後退到 73 格。" },
            95: { end: 75, type: 'snake', title: "幽靈漁具 👻", text: "被遺棄的「幽靈漁具」持續在海中捕殺魚類。後退到 75 格。" },
            99: { end: 78, type: 'snake', title: "非法傾倒 🏭", text: "工廠非法向海洋傾倒未處理的塑膠廢料。這太可惡了！後退到 78 格。" },

            // Fun Facts (Yellow)
            2: { type: 'fact', title: "你知道嗎？ 🤔", text: "太平洋垃圾帶 (GPGP) 並不只是一座島，它更像是一碗充滿塑膠碎片的「濃湯」！🍵" },
            12: { type: 'fact', title: "微纖維 👕", text: "每次洗滌合成纖維的衣服（如聚酯纖維）時，數千條微小的塑膠纖維會脫落並流入海洋。" },
            25: { type: 'fact', title: "陽光的作用 ☀️", text: "海洋中的塑膠通常不會「生物分解」，而是因陽光照射而「光降解」，碎裂成更小的微塑膠。" },
            36: { type: 'fact', title: "無處不在 🏔️", text: "科學家甚至在聖母峰的頂端和馬里亞納海溝的底部都發現了微塑膠！🌍" },
            45: { type: 'fact', title: "海洋生物的危機 🐋", text: "每年有超過 100 萬隻海鳥和 10 萬隻海洋哺乳動物因塑膠污染而死亡。😢" },
            58: { type: 'fact', title: "來源哪裡來？ 🏙️", text: "海洋垃圾中，約有 80% 來自陸地上的活動，只有 20% 來自海上活動（如漁業）。" },
            77: { type: 'fact', title: "大大小小 📏", text: "微塑膠被定義為直徑小於 5 毫米的塑膠碎片，比一顆米粒還小！🍚" },
            82: { type: 'fact', title: "煙蒂也是塑膠 🚬", text: "香煙過濾嘴是由醋酸纖維素（一種塑膠）製成的，它們是海灘上最常見的垃圾之一。" }
        };

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 20, 90);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        function updateCameraPosition() {
            const aspect = window.innerWidth / window.innerHeight;
            if (aspect < 1) {
                camera.position.set(0, 45, 35); 
                camera.lookAt(0, -5, 0);
            } else {
                camera.position.set(0, 32, 24);
                camera.lookAt(0, -2, 0);
            }
            camera.aspect = aspect;
            camera.updateProjectionMatrix();
        }

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 30, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -25;
        dirLight.shadow.camera.right = 25;
        dirLight.shadow.camera.top = 25;
        dirLight.shadow.camera.bottom = -25;
        scene.add(dirLight);

        // --- Environment & Board ---
        const tiles = [];
        const tileGroup = new THREE.Group();
        scene.add(tileGroup);
        const boardOffset = (BOARD_SIZE * TILE_SIZE) / 2 - (TILE_SIZE / 2);

        function createEnvironment() {
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshPhongMaterial({ 
                color: 0x1e3a8a, 
                shininess: 40,
                specular: 0x444444
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.5;
            floor.receiveShadow = true;
            scene.add(floor);

            createBuoy(-15, 0, 5);
            createBuoy(15, 0, -5);
            createPaperBoat(12, 0, 12);
            createTrashIsland(-20, -1, -20);
        }

        function createBuoy(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            const baseGeo = new THREE.CylinderGeometry(1, 1, 1.5, 16);
            const baseMat = new THREE.MeshPhongMaterial({ color: 0xef4444 });
            const base = new THREE.Mesh(baseGeo, baseMat);
            group.add(base);
            const stickGeo = new THREE.CylinderGeometry(0.1, 0.1, 3, 8);
            const stick = new THREE.Mesh(stickGeo, new THREE.MeshPhongMaterial({ color: 0xffffff }));
            stick.position.y = 1.5;
            group.add(stick);
            group.userData = { offset: Math.random() * Math.PI, speed: 2 };
            buoys.push(group);
            scene.add(group);
        }

        function createPaperBoat(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            group.rotation.y = -0.5;
            const mat = new THREE.MeshPhongMaterial({ color: 0xf1f5f9, side: THREE.DoubleSide });
            const hullGeo = new THREE.ConeGeometry(1.5, 1, 4, 1, true);
            const hull = new THREE.Mesh(hullGeo, mat);
            hull.scale.set(1, 1, 2.5);
            hull.rotation.x = Math.PI;
            hull.position.y = 0.5;
            group.add(hull);
            const sailGeo = new THREE.BufferGeometry();
            const vertices = new Float32Array([0, 0.5, 0.5, 0, 2.5, 0.5, 0, 0.5, -1.5]);
            sailGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            const sail = new THREE.Mesh(sailGeo, mat);
            group.add(sail);
            group.userData = { offset: Math.random() * Math.PI, speed: 1.5 };
            buoys.push(group);
            scene.add(group);
        }

        function createTrashIsland(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            const trashMat = new THREE.MeshLambertMaterial({ color: 0x475569 });
            for(let i=0; i<15; i++) {
                const s = 1 + Math.random() * 2;
                const geo = new THREE.BoxGeometry(s, s*0.5, s);
                const m = new THREE.Mesh(geo, trashMat);
                m.position.set((Math.random()-0.5) * 10, Math.random() * 1, (Math.random()-0.5) * 8);
                m.rotation.set(Math.random(), Math.random(), Math.random());
                group.add(m);
            }
            scene.add(group);
        }

        function createBoard() {
            for (let i = 0; i < BOARD_SIZE * BOARD_SIZE; i++) {
                let row = Math.floor(i / BOARD_SIZE);
                let col = i % BOARD_SIZE;
                let xIndex = row % 2 === 0 ? col : (BOARD_SIZE - 1 - col);
                let zIndex = (BOARD_SIZE - 1) - row;
                const x = xIndex * TILE_SIZE - boardOffset;
                const z = zIndex * TILE_SIZE - boardOffset;
                const geometry = new THREE.BoxGeometry(TILE_SIZE * 0.95, 0.5, TILE_SIZE * 0.95);
                const isEven = (xIndex + row) % 2 === 0;
                const color = isEven ? 0xbfdbfe : 0x60a5fa;
                const material = new THREE.MeshLambertMaterial({ color: color });
                const cube = new THREE.Mesh(geometry, material);
                cube.position.set(x, 0, z);
                cube.receiveShadow = true;
                cube.castShadow = true;
                tileGroup.add(cube);
                tiles.push(new THREE.Vector3(x, 0.5, z));
                if (i === 0) addMarker(x, z, 0x22c55e);
                if (i === 99) addMarker(x, z, 0xfacc15);
                
                const event = EVENTS[i + 1];
                if (event && event.type === 'fact') {
                    addQuestionMark(x, z);
                }
            }
            drawConnections();
        }

        function drawConnections() {
            Object.keys(EVENTS).forEach(startKey => {
                const startIdx = parseInt(startKey) - 1;
                const event = EVENTS[startKey];
                if (event.type === 'fact') return; 

                const endIdx = event.end - 1;
                const startPos = tiles[startIdx];
                const endPos = tiles[endIdx];
                const isSnake = event.type === 'snake';
                const color = isSnake ? 0xef4444 : 0x22c55e;
                const midPoint = new THREE.Vector3().addVectors(startPos, endPos).multiplyScalar(0.5);
                midPoint.y += isSnake ? 4 : 6;
                const path = new THREE.QuadraticBezierCurve3(startPos, midPoint, endPos);
                const tubeGeo = new THREE.TubeGeometry(path, 32, 0.15, 8, false);
                const tubeMat = new THREE.MeshPhongMaterial({ color: color });
                const tube = new THREE.Mesh(tubeGeo, tubeMat);
                tube.castShadow = true;
                scene.add(tube);
            });
        }

        function addMarker(x, z, color) {
            const geo = new THREE.CylinderGeometry(0.6, 0.6, 0.1, 16);
            const mat = new THREE.MeshBasicMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.3, z);
            scene.add(mesh);
        }

        function addQuestionMark(x, z) {
            const geo = new THREE.CylinderGeometry(0.4, 0.4, 0.15, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0xfacc15 }); 
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.3, z);
            scene.add(mesh);
        }

        function createBoardDecorations() {
            const specialIndices = new Set([0, 99]);
            Object.keys(EVENTS).forEach(k => {
                specialIndices.add(parseInt(k)-1);
                if(EVENTS[k].end) specialIndices.add(EVENTS[k].end-1);
            });
            [12, 35, 58, 81].forEach(idx => {
                if(!specialIndices.has(idx)) {
                    const pos = tiles[idx];
                    createTurtle(pos.x + (Math.random()-0.5)*0.8, pos.y, pos.z + (Math.random()-0.5)*0.8);
                }
            });
            [25, 48, 65, 90, 5].forEach(idx => {
                 const pos = tiles[idx];
                 createPlasticDebris(pos.x + (Math.random()-0.5)*1, pos.y - 0.1, pos.z + (Math.random()-0.5)*1);
             });
        }

        function createTurtle(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            group.rotation.y = Math.random() * Math.PI * 2;
            const shell = new THREE.Mesh(
                new THREE.SphereGeometry(0.4, 8, 8),
                new THREE.MeshPhongMaterial({ color: 0x34d399 })
            );
            shell.scale.set(1, 0.5, 1.1);
            shell.position.y = 0.2;
            shell.castShadow = true;
            group.add(shell);
            const head = new THREE.Mesh(
                new THREE.SphereGeometry(0.2, 8, 8),
                new THREE.MeshPhongMaterial({ color: 0xa7f3d0 })
            );
            head.position.set(0, 0.25, 0.5);
            group.add(head);
            scene.add(group);
        }

        function createPlasticDebris(x, y, z) {
            const group = new THREE.Group();
            group.position.set(x, y, z);
            const mat = new THREE.MeshPhongMaterial({ color: 0xf8fafc, transparent: true, opacity: 0.7 });
            for(let i=0; i<2; i++) {
                const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25, 0), mat);
                m.scale.set(1+Math.random(), 0.3, 1+Math.random());
                m.position.set((Math.random()-0.5)*0.3, 0.1, (Math.random()-0.5)*0.3);
                group.add(m);
            }
            scene.add(group);
        }

        // --- Players ---
        const players = [
            { id: 1, pos: 0, mesh: null, color: 0xdc2626, displayId: 'p1-score' },
            { id: 2, pos: 0, mesh: null, color: 0x2563eb, displayId: 'p2-score' }
        ];
        let currentPlayerIndex = 0;
        let isMoving = false;
        let gameWon = false;

        function createPlayers() {
            players.forEach((p, index) => {
                const geo = new THREE.SphereGeometry(0.6, 32, 32);
                const mat = new THREE.MeshPhongMaterial({ color: p.color, shininess: 100 });
                const mesh = new THREE.Mesh(geo, mat);
                const offset = index === 0 ? -0.4 : 0.4;
                const startPos = tiles[0];
                mesh.position.set(startPos.x + offset, startPos.y + 0.6, startPos.z);
                mesh.castShadow = true;
                scene.add(mesh);
                p.mesh = mesh;
            });
        }

        // --- Victory Balloon ---
        let victoryBalloon = null;
        let victoryBalloonRising = false;
        let victoryBalloonTarget = null;
        let videoHasStarted = false;

        function createVictoryBalloon() {
            const balloonGroup = new THREE.Group();
            
            // Heart Shape
            const x = 0, y = 0;
            const heartShape = new THREE.Shape();
            heartShape.moveTo( x + 5, y + 5 );
            heartShape.bezierCurveTo( x + 5, y + 5, x + 4, y, x, y );
            heartShape.bezierCurveTo( x - 6, y, x - 6, y + 7,x - 6, y + 7 );
            heartShape.bezierCurveTo( x - 6, y + 11, x - 3, y + 15.4, x + 5, y + 19 );
            heartShape.bezierCurveTo( x + 12, y + 15.4, x + 16, y + 11, x + 16, y + 7 );
            heartShape.bezierCurveTo( x + 16, y + 7, x + 16, y, x + 10, y );
            heartShape.bezierCurveTo( x + 7, y, x + 5, y + 5, x + 5, y + 5 );

            const extrudeSettings = { depth: 2, bevelEnabled: true, bevelSegments: 2, steps: 2, bevelSize: 1, bevelThickness: 1 };
            const geometry = new THREE.ExtrudeGeometry( heartShape, extrudeSettings );
            geometry.center();
            
            const material = new THREE.MeshPhongMaterial({ color: 0xff69b4, shininess: 60 });
            const heartMesh = new THREE.Mesh( geometry, material );
            heartMesh.scale.set(0.5, 0.5, 0.5);
            heartMesh.position.y = 8;
            heartMesh.rotation.z = Math.PI; 
            heartMesh.rotation.x = Math.PI;
            
            balloonGroup.add( heartMesh );

            const basketGeo = new THREE.BoxGeometry(3, 2, 3);
            const basketMat = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
            const basket = new THREE.Mesh(basketGeo, basketMat);
            basket.position.y = 0;
            balloonGroup.add(basket);

            const lineMat = new THREE.LineBasicMaterial({ color: 0x000000 });
            const ropeGeo = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(-1.5, 1, -1.5), new THREE.Vector3(-2, 4, -1),
                new THREE.Vector3(1.5, 1, -1.5), new THREE.Vector3(2, 4, -1),
                new THREE.Vector3(1.5, 1, 1.5), new THREE.Vector3(2, 4, 1),
                new THREE.Vector3(-1.5, 1, 1.5), new THREE.Vector3(-2, 4, 1)
            ]);
            const ropes = new THREE.LineSegments(ropeGeo, lineMat);
            balloonGroup.add(ropes);

            balloonGroup.position.set(25, 5, -25);
            scene.add(balloonGroup);
            
            victoryBalloon = balloonGroup;
            victoryBalloon.userData = { startY: 5, speed: 1, offset: 0 };
            buoys.push(victoryBalloon);
        }


        // --- Game Logic ---
        const rollBtn = document.getElementById('roll-btn');
        const diceResultDiv = document.getElementById('dice-result');
        const turnIndicator = document.getElementById('turn-indicator');

        rollBtn.addEventListener('click', async () => {
            if (isMoving || gameWon) return;
            
            // Init audio on user interaction
            initAudio();
            
            isMoving = true;
            rollBtn.disabled = true;
            rollBtn.classList.add('opacity-50');

            for(let i=0; i<10; i++) {
                let r = Math.floor(Math.random() * 6) + 1;
                diceResultDiv.innerText = "🎲 " + r;
                playDiceSound(); // Play little tick sound
                await new Promise(r => setTimeout(r, 50));
            }
            
            const finalRoll = Math.floor(Math.random() * 6) + 1;
            diceResultDiv.innerText = "🎲 " + finalRoll;
            await movePlayer(players[currentPlayerIndex], finalRoll);
        });

        async function movePlayer(player, steps) {
            let currentTileIdx = player.pos;
            let targetTileIdx = currentTileIdx + steps;

            if (targetTileIdx >= 99) {
                targetTileIdx = 99;
            }

            for (let i = currentTileIdx + 1; i <= targetTileIdx; i++) {
                await hopTo(player, i);
            }
            
            player.pos = targetTileIdx;
            const event = EVENTS[targetTileIdx + 1];

            if (event) {
                await new Promise(r => setTimeout(r, 400));
                showFactModal(event, async () => {
                    if (event.end) {
                        const endIdx = event.end - 1;
                        await slideTo(player, endIdx);
                        player.pos = endIdx;
                    }
                    checkWin(player);
                });
            } else {
                checkWin(player);
            }
        }

        async function hopTo(player, tileIdx) {
            const start = player.mesh.position.clone();
            const dest = tiles[tileIdx].clone();
            const offset = player.id === 1 ? -0.4 : 0.4;
            dest.x += offset;
            dest.y += 0.6;
            const duration = 300;
            const startTime = Date.now();
            
            // Play sound!
            playMoveSound(player.id);

            return new Promise(resolve => {
                function animateHop() {
                    const now = Date.now();
                    const progress = Math.min((now - startTime) / duration, 1);
                    player.mesh.position.lerpVectors(start, dest, progress);
                    player.mesh.position.y = dest.y + Math.sin(progress * Math.PI) * 1.5;
                    if (progress < 1) requestAnimationFrame(animateHop);
                    else resolve();
                }
                animateHop();
            });
        }

        async function slideTo(player, tileIdx) {
            const start = player.mesh.position.clone();
            const dest = tiles[tileIdx].clone();
            const offset = player.id === 1 ? -0.4 : 0.4;
            dest.x += offset;
            dest.y += 0.6;
            const duration = 1000;
            const startTime = Date.now();
            return new Promise(resolve => {
                function animateSlide() {
                    const now = Date.now();
                    const progress = Math.min((now - startTime) / duration, 1);
                    player.mesh.position.lerpVectors(start, dest, progress);
                    if (progress < 1) requestAnimationFrame(animateSlide);
                    else resolve();
                }
                animateSlide();
            });
        }

        function checkWin(player) {
            updateScoreUI();
            if (player.pos === 99) {
                triggerWin(player);
            } else {
                currentPlayerIndex = currentPlayerIndex === 0 ? 1 : 0;
                updateTurnUI();
                isMoving = false;
                rollBtn.disabled = false;
                rollBtn.classList.remove('opacity-50');
            }
        }

        function triggerWin(player) {
            gameWon = true;
            const winToast = document.getElementById('win-toast');
            document.getElementById('winner-text').innerText = `玩家 ${player.id} 獲勝！`;
            winToast.classList.remove('hidden-custom');
            
            // Hide UI
            document.getElementById('ui-layer').classList.add('opacity-0');
            
            // Balloon Logic
            victoryBalloonTarget = player.mesh.position.clone();
            const index = buoys.indexOf(victoryBalloon);
            if (index > -1) {
                buoys.splice(index, 1);
            }
            victoryBalloonRising = true;

            // Confetti
            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
            
            // Auto hide toast after 3s so we can see balloon
            setTimeout(() => {
                winToast.classList.add('opacity-0');
            }, 3000);
        }

        function updateTurnUI() {
            const isP1 = currentPlayerIndex === 0;
            turnIndicator.className = `text-sm md:text-base font-bold px-4 py-2 rounded-full border transition-all ${isP1 ? 'bg-red-100 text-red-600 border-red-200' : 'bg-blue-100 text-blue-600 border-blue-200'}`;
            turnIndicator.innerText = `換 玩家 ${currentPlayerIndex + 1}`;
            
            const rollBtn = document.getElementById('roll-btn');
            if(isP1) {
                rollBtn.className = rollBtn.className.replace(/from-blue-600 to-blue-400/g, 'from-red-500 to-red-400').replace(/active:from-blue-700/g, 'active:from-red-700');
            } else {
                rollBtn.className = rollBtn.className.replace(/from-red-500 to-red-400/g, 'from-blue-600 to-blue-400').replace(/active:from-red-700/g, 'active:from-blue-700');
            }
        }

        function updateScoreUI() {
            document.getElementById('p1-score').innerText = `P1: ${players[0].pos + 1}`;
            document.getElementById('p2-score').innerText = `P2: ${players[1].pos + 1}`;
        }

        let currentModalCallback = null;
        function showFactModal(event, callback) {
            currentModalCallback = callback;
            document.getElementById('modal-title').innerText = event.title;
            document.getElementById('modal-desc').innerText = event.text;
            const icon = document.getElementById('modal-icon');
            const title = document.getElementById('modal-title');
            
            if (event.type === 'snake') {
                icon.innerText = "⚠️";
                title.className = "text-xl md:text-2xl font-bold mb-3 text-red-600";
            } else if (event.type === 'ladder') {
                icon.innerText = "🌱";
                title.className = "text-xl md:text-2xl font-bold mb-3 text-green-600";
            } else {
                icon.innerText = "💡";
                title.className = "text-xl md:text-2xl font-bold mb-3 text-yellow-600";
            }
            document.getElementById('fact-modal').classList.remove('hidden-custom');
        }

        window.closeModal = function() {
            document.getElementById('fact-modal').classList.add('hidden-custom');
            if (currentModalCallback) {
                currentModalCallback();
                currentModalCallback = null;
            }
        }
        
        function playVictoryVideo() {
            if (videoHasStarted) return;
            videoHasStarted = true;
            const overlay = document.getElementById('video-overlay');
            const video = document.getElementById('victory-video');
            
            overlay.classList.remove('hidden-custom');
            // Fade in
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                video.play().catch(e => console.log("Autoplay prevented, user gesture needed likely:", e));
            }, 100);
        }

        // --- Animation & Init ---
        const buoys = [];

        function init() {
            createEnvironment();
            createBoard();
            createBoardDecorations();
            createPlayers();
            createVictoryBalloon();
            updateCameraPosition();
            updateTurnUI();
            
            function animate() {
                requestAnimationFrame(animate);
                
                const time = Date.now() * 0.001;
                buoys.forEach(b => {
                    const startY = b.userData.startY || 0;
                    b.position.y = startY + Math.sin(time * b.userData.speed + b.userData.offset) * 0.5;
                    if(b.rotation.y) b.rotation.y += 0.002;
                });

                // Victory Animation
                if (victoryBalloonRising && victoryBalloon && victoryBalloonTarget) {
                    // 1. Move to player XY
                    const targetPos = victoryBalloonTarget;
                    const dx = targetPos.x - victoryBalloon.position.x;
                    const dz = targetPos.z - victoryBalloon.position.z;
                    
                    if (Math.abs(dx) > 0.1 || Math.abs(dz) > 0.1) {
                        // Move towards player
                        victoryBalloon.position.x += dx * 0.03;
                        victoryBalloon.position.z += dz * 0.03;
                        victoryBalloon.position.y += (5 - victoryBalloon.position.y) * 0.02;
                        
                        // Rotate to face movement
                        victoryBalloon.rotation.y = Math.atan2(dx, dz);
                    } else {
                        // 2. Pick up player and Rise
                        victoryBalloon.position.y += 0.08; // Rising speed
                        victoryBalloon.rotation.y += 0.005;
                        
                        // Put winning player in basket
                        const winner = players[0].pos === 99 ? players[0] : players[1];
                        winner.mesh.position.x = victoryBalloon.position.x;
                        winner.mesh.position.z = victoryBalloon.position.z;
                        winner.mesh.position.y = victoryBalloon.position.y + 2;

                        // Camera follows balloon
                        camera.position.y += ((victoryBalloon.position.y + 10) - camera.position.y) * 0.05;
                        camera.lookAt(victoryBalloon.position.x, victoryBalloon.position.y + 5, victoryBalloon.position.z);
                        
                        // 3. Trigger Video at height
                        if (victoryBalloon.position.y > 30 && !videoHasStarted) {
                            playVictoryVideo();
                        }
                    }
                }

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                updateCameraPosition();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        init();
    </script>
</body>
</html>
